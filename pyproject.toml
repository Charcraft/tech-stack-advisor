[project]
name = "tech-stack-advisor"
version = "1.0.0"
description = "Evaluates your project and recommends the optimal tech stack with senior justification"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Carlos Martinez Pineda", email = "charcraftycarlos@gmail.com"}
]
maintainers = [
    {name = "Carlos Martinez Pineda", email = "charcraftycarlos@gmail.com"}
]
keywords = [
    "tech-stack", "architecture-decision", "startup-tools", 
    "cto-fractional", "architecture-decision-record", "skill"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Charcraft/tech-stack-advisor"
Repository = "https://github.com/Charcraft/tech-stack-advisor.git"
Issues = "https://github.com/Charcraft/tech-stack-advisor/issues"
Documentation = "https://github.com/Charcraft/tech-stack-advisor#readme"

[project.scripts]
tech-stack-advisor = "tech_stack_advisor.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true