# Tech Stack Advisor - Universal Workflow
# Compatible with: opencode, Claude Code, agent-run, and any skill harness
# Tool names are generic; harness maps them via skill.json.harness_compatibility

name: tech-stack-evaluation
version: "1.0"
description: |
  Evaluates a project and recommends the optimal tech stack.
  Flow: detect → analyze → interview → recommend → report
  Outputs: STACK_DECISION.md (ADR) + NEXT_STEPS.md (checklist)

# Generic tool interface (harness maps to native tools)
tools:
  - read_files      # Read file contents
  - glob_files      # Find files by pattern
  - search_files    # Search file contents
  - ask_user        # Interactive question to user
  - write_files     # Write file contents
  - run_shell       # Execute shell command

steps:
  # 1. Heuristic detection (fast, deterministic, no LLM)
  - id: detect
    name: "Detect stack signals from codebase"
    tool: run_shell
    cmd: python scripts/detect_stack.py ${project_path:-.}
    output: detected
    timeout: 30
    description: |
      Scans package.json, go.mod, Cargo.toml, pyproject.toml, Dockerfile,
      docker-compose, CI/CD, SQL migrations, etc. Emits JSON signals.

  # 2. Senior Architect Analysis (LLM)
  - id: analyze
    name: "Senior architect codebase analysis"
    tool: llm
    prompt: prompts/analyze-project.md
    input: detected
    output: analysis
    model:
      temperature: 0.1
      max_tokens: 4000
    description: |
      Extracts: project type, domain, scale signals, team signals,
      constraints, pain points, goals. Strict JSON output.

  # 3. CTO-Fractional Interview (LLM, interactive)
  - id: interview
    name: "Interactive interview (5-7 key questions)"
    tool: llm
    prompt: prompts/interview.md
    input: analysis
    output: interview
    loop: true
    until: "interview.done == true"
    max_iterations: 7
    model:
      temperature: 0.3
      max_tokens: 3000
    description: |
      One question at a time, plain language, each with 'why'.
      Stops at 5+ answers or user says "enough".

  # 4. Decision Engine (LLM)
  - id: recommend
    name: "Recommendation with trade-offs"
    tool: llm
    prompt: prompts/recommend.md
    input:
      analysis: "{{analysis}}"
      interview: "{{interview}}"
    output: recommendation
    model:
      temperature: 0.2
      max_tokens: 5000
    description: |
      Applies weighted decision matrix, outputs Markdown with:
      - Primary recommendation (justification + trade-offs)
      - 2 Alternatives (when to choose + real cost)
      - Actionable next step (copy-paste command)

  # 5. Technical Writer (LLM)
  - id: report
    name: "Generate versionable artifacts"
    tool: llm
    prompt: prompts/report.md
    input:
      analysis: "{{analysis}}"
      interview: "{{interview}}"
      recommendation: "{{recommendation}}"
    output: files
    write_to:
      - path: "${decision_file:-STACK_DECISION.md}"
        from: "files.STACK_DECISION"
      - path: "${next_steps_file:-NEXT_STEPS.md}"
        from: "files.NEXT_STEPS"
    description: |
      Writes two Markdown files ready for git commit:
      - STACK_DECISION.md: Lightweight ADR (context, decision, consequences, follow-up)
      - NEXT_STEPS.md: Actionable checklist with done criteria

# Metadata for skill registries
metadata:
  category: architecture
  maturity: stable
  estimated_duration: "10-20 minutes"
  requires_user_input: true
  output_files:
    - STACK_DECISION.md
    - NEXT_STEPS.md
  tags:
    - tech-stack
    - architecture-decision-record
    - startup
    - planning
    - cto-fractional